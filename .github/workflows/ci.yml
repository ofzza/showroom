name: CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

permissions:
  contents: read

# Supersede superseded pull request runs, but never cancel a run on master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      # No token left in .git/config for the code it runs (`ci:showroom` runs this repository's own showcases with --trust)
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The .NET SDK 10, for the cs showcase adapter's tests and showcase adapter example (SPEC-S16 D718)
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Plain `npm ci`: `--ignore-scripts` would skip install hooks that `unrs-resolver` and
      # `@parcel/watcher` rely on to link their native bindings
      - run: npm ci

      # Build, ESLint, Prettier and tests, run sequentially by `npm-run-all ci:*`
      - run: npm run ci
