<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>numerals: a 7-segment clock</title>
    <style>
      body {
        margin: 0;
        padding: 1rem;
        font-family: system-ui, sans-serif;
      }
      .clock {
        display: inline-flex;
        gap: 0.5rem;
        align-items: center;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        background: light-dark(#1f2328, #0d1117);
      }
      .digit {
        position: relative;
        width: 1.75rem;
        height: 3rem;
      }
      .segment {
        position: absolute;
        border-radius: 0.2rem;
        background: #ff5c5c;
        opacity: 0.08;
        transition: opacity 0.15s;
      }
      .segment.on {
        opacity: 1;
        box-shadow: 0 0 0.4rem #ff5c5c;
      }
      .a,
      .d,
      .g {
        left: 0.25rem;
        width: 1.25rem;
        height: 0.25rem;
      }
      .a {
        top: 0;
      }
      .g {
        top: 1.375rem;
      }
      .d {
        bottom: 0;
      }
      .b,
      .c,
      .e,
      .f {
        width: 0.25rem;
        height: 1.25rem;
      }
      .b,
      .f {
        top: 0.2rem;
      }
      .c,
      .e {
        bottom: 0.2rem;
      }
      .b,
      .c {
        right: 0;
      }
      .e,
      .f {
        left: 0;
      }
      .colon {
        color: #ff5c5c;
        font-size: 2rem;
        line-height: 1;
        text-shadow: 0 0 0.4rem #ff5c5c;
      }
    </style>
  </head>
  <body>
    <div class="clock" id="clock" role="timer" aria-live="off"></div>
    <script>
      // The segments lit for each digit, in the usual a-g naming
      const DIGITS = ['abcdef', 'bc', 'abdeg', 'abcdg', 'bcfg', 'acdfg', 'acdefg', 'abc', 'abcdefg', 'abcdfg'];

      // Builds one digit's seven segments
      const createDigit = () => {
        const digit = document.createElement('div');
        digit.className = 'digit';
        for (const name of 'abcdefg') {
          const segment = document.createElement('span');
          segment.className = `segment ${name}`;
          digit.append(segment);
        }
        return digit;
      };

      // Lays out HH:MM:SS
      const clock = document.getElementById('clock');
      const digits = [];
      for (let group = 0; group < 3; group++) {
        if (group) {
          const colon = document.createElement('span');
          colon.className = 'colon';
          colon.textContent = ':';
          clock.append(colon);
        }
        for (let i = 0; i < 2; i++) {
          digits.push(clock.appendChild(createDigit()));
        }
      }

      // Lights the segments of the current time, every second
      const tick = () => {
        const now = new Date();
        const text = [now.getHours(), now.getMinutes(), now.getSeconds()].map((part) => String(part).padStart(2, '0')).join('');
        clock.setAttribute('aria-label', `${text.slice(0, 2)}:${text.slice(2, 4)}:${text.slice(4)}`);
        digits.forEach((digit, i) => {
          const lit = DIGITS[Number(text[i])];
          for (const segment of digit.children) {
            segment.classList.toggle('on', lit.includes(segment.classList[1]));
          }
        });
      };
      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
